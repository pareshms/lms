<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Library Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head><body class="login-page">
<div class="login-card">
  <div class="login-header">
    <i class="fas fa-book-open"></i>
    <h1>Library Management System</h1>
    <p>Sign in to continue</p>
  </div>
  <form id="loginForm">
    <div class="form-group"><label>Username</label><div class="input-group"><i class="fas fa-user"></i><input type="text" id="username" required placeholder="admin"></div></div>
    <div class="form-group"><label>Password</label><div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" required placeholder="admin123"></div></div>
    <button type="submit" class="btn-login">Sign In</button>
    <div id="loginError" class="error-message" style="display:none"></div>
  </form>
</div>
<script src="js/auth.js"></script>
</body></html>
