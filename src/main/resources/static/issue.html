<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Issue / Return — Library MS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-book-open"></i><h2>LibraryMS</h2></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="books.html" class="nav-link"><i class="fas fa-book"></i><span>Books</span></a>
      <a href="members.html" class="nav-link"><i class="fas fa-users"></i><span>Members</span></a>
      <a href="issue.html" class="nav-link active"><i class="fas fa-exchange-alt"></i><span>Issue / Return</span></a>
      <a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
    </nav>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left"><button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button><h1>Issue / Return</h1></div>
      <div class="topbar-right"><span class="user-name" id="userName"></span><button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </header>
    <div class="content">
      <!-- Issue Form -->
      <div class="card">
        <div class="card-header"><h3><i class="fas fa-hand-holding"></i> Issue a Book</h3></div>
        <form id="issueForm" onsubmit="issueBook(event)">
          <div class="form-row">
            <div class="form-group"><label>Select Member *</label><select id="memberSelect" required><option value="">-- choose --</option></select></div>
            <div class="form-group"><label>Select Book *</label><select id="bookSelect" required><option value="">-- choose --</option></select></div>
          </div>
          <button type="submit" class="btn btn-success"><i class="fas fa-check"></i> Issue Book (14-day loan)</button>
        </form>
      </div>
      <!-- Active Borrows -->
      <div class="card">
        <div class="card-header"><h3><i class="fas fa-list"></i> Active / Overdue Borrows</h3></div>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>Member</th><th>Book</th><th>Issued</th><th>Due</th><th>Status</th><th>Fine</th><th>Action</th></tr></thead><tbody id="activeTable"></tbody></table></div>
      </div>
    </div>
  </main>
</div>
<script src="js/common.js"></script><script src="js/issue.js"></script>
</body></html>
