<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Members — Library MS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-book-open"></i><h2>LibraryMS</h2></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="books.html" class="nav-link"><i class="fas fa-book"></i><span>Books</span></a>
      <a href="members.html" class="nav-link active"><i class="fas fa-users"></i><span>Members</span></a>
      <a href="issue.html" class="nav-link"><i class="fas fa-exchange-alt"></i><span>Issue / Return</span></a>
      <a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
    </nav>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left"><button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button><h1>Members</h1></div>
      <div class="topbar-right"><span class="user-name" id="userName"></span><button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </header>
    <div class="content">
      <div class="page-header">
        <div class="search-bar"><input type="text" id="searchInput" placeholder="Search name or email…"><button class="btn btn-primary" onclick="searchMembers()"><i class="fas fa-search"></i></button></div>
        <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Add Member</button>
      </div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Type</th><th>Dept</th><th>Limit</th><th>Status</th><th>Actions</th></tr></thead><tbody id="membersTable"></tbody></table></div></div>
    </div>
  </main>
</div>
<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTitle">Add Member</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="memberForm" onsubmit="saveMember(event)">
      <input type="hidden" id="mId">
      <div class="form-group"><label>Type *</label><select id="mType" required onchange="toggleTypeFields()"><option value="STUDENT">Student</option><option value="FACULTY">Faculty</option></select></div>
      <div class="form-row">
        <div class="form-group"><label>Name *</label><input id="mName" required></div>
        <div class="form-group"><label>Email *</label><input type="email" id="mEmail" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Phone</label><input id="mPhone"></div>
        <div class="form-group"><label>Username *</label><input id="mUsername" required></div>
      </div>
      <div class="form-group"><label>Password</label><input type="password" id="mPassword" placeholder="Leave blank to keep"></div>
      <!-- Student fields -->
      <div id="studentFields">
        <div class="form-row">
          <div class="form-group"><label>Roll Number</label><input id="mRoll"></div>
          <div class="form-group"><label>Year</label><input type="number" id="mYear" min="1" max="5"></div>
        </div>
      </div>
      <!-- Faculty fields -->
      <div id="facultyFields" style="display:none">
        <div class="form-row">
          <div class="form-group"><label>Employee ID</label><input id="mEmpId"></div>
          <div class="form-group"><label>Designation</label><input id="mDesig"></div>
        </div>
      </div>
      <div class="form-group"><label>Department</label><input id="mDept"></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>
</div>
<!-- History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header"><h3>Borrowing History</h3><button class="modal-close" onclick="document.getElementById('historyModal').classList.remove('active')">&times;</button></div>
    <div class="table-wrap"><table><thead><tr><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th><th>Status</th></tr></thead><tbody id="historyTable"></tbody></table></div>
  </div>
</div>
<script src="js/common.js"></script><script src="js/members.js"></script>
</body></html>
