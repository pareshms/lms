<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Books — Library MS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-book-open"></i><h2>LibraryMS</h2></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="books.html" class="nav-link active"><i class="fas fa-book"></i><span>Books</span></a>
      <a href="members.html" class="nav-link"><i class="fas fa-users"></i><span>Members</span></a>
      <a href="issue.html" class="nav-link"><i class="fas fa-exchange-alt"></i><span>Issue / Return</span></a>
      <a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
    </nav>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left"><button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button><h1>Books</h1></div>
      <div class="topbar-right"><span class="user-name" id="userName"></span><button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
    </header>
    <div class="content">
      <div class="page-header">
        <div class="search-bar"><input type="text" id="searchInput" placeholder="Search title, author, ISBN…"><button class="btn btn-primary" onclick="searchBooks()"><i class="fas fa-search"></i></button></div>
        <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Add Book</button>
      </div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Qty</th><th>Avail</th><th>Status</th><th>Actions</th></tr></thead><tbody id="booksTable"></tbody></table></div></div>
    </div>
  </main>
</div>
<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTitle">Add Book</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="bookForm" onsubmit="saveBook(event)">
      <input type="hidden" id="bookId">
      <div class="form-group"><label>Title *</label><input id="bTitle" required></div>
      <div class="form-row">
        <div class="form-group"><label>Author *</label><input id="bAuthor" required></div>
        <div class="form-group"><label>ISBN *</label><input id="bIsbn" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Category</label><input id="bCategory"></div>
        <div class="form-group"><label>Quantity *</label><input type="number" id="bQty" min="1" required></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>
</div>
<script src="js/common.js"></script><script src="js/books.js"></script>
</body></html>
